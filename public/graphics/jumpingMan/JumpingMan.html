<body bgcolor=black>
   
<center><h1 style="color:white; font-family: Arial;" >Drag all the way to see him really try to jump!</h1><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

// ADDING REACHING AND LOOKING

function Scene() {

let ball = Shape.sphereMesh(20,10);
let tube = Shape.tubeMesh(20);
let cube = Shape.cubeMesh();

this.vertexShader = Shader.defaultVertexShader;
this.fragmentShader = Shader.defaultFragmentShader;

autodraw = false;

let M = new Matrix();

let spin = 1*Math.PI/4;
// mouse.drag = (x,y) => spin += x;

let draw = (mesh, matrix, color) => {
   
   let m = mxm(perspective(0,0,-.5),
           mxm(turnY(spin),
	   mxm(scale(.7),
               matrix ?? M.get())));
   setUniform('Matrix4fv', 'uMF', false, m);
   setUniform('Matrix4fv', 'uMI', false, inverse(m));
   setUniform('3fv', 'uColor', color ?? [1,1,1]);
   drawMesh(mesh);
   return this;
}

let Hip = [], Knee = [], Ankle = [];
let Shoulder = [], Elbow = [], Wrist = [];

let pos = m => m.slice(12,15);

let drawRod = (A,B,r) => {
   let D = subtract(B,A);
   draw(tube, mxm(move(mix(A,B,.5)),
              mxm(aim(D),
	          scale(r,r,norm(D)/2))));
}

let sway = 0;
let legLen = 1.30;
let stride = legLen * 0.33;
let rate = 2.0;
let timeDown = 0;

let spring = new Spring();
let force = 0, bend = 0;
let jump  = 0;
let charging = false;
let headcolor = [1,1,1];
let eyesize = 0.03;
let wipe = 0;
let elbowFlare = 0;
spring.setDamping(8);
mouse.drag = (x,y) => {
   bend -= y;
   console.log(bend);
}

mouse.up = () => {
   force = Math.max(bend+.5*timeDown,0)
   timeDown = 0;
   rate = 4;
};

this.update = () => {
   let time = Date.now()/1000;
   if (mouse.isDown) {
      wipe += (0 - wipe) * 0.12;
      if (bend >= 1.2) {
         bend = 1.2;
         timeDown++;
         charging = true;
         
      }
   }
   if (! mouse.isDown) {
      spring.setForce(force *= .9);
      
      spring.update(.03);
      bend = Math.max(0,bend-0.1);
      jump = spring.getPosition();
      charging = false;
      headcolor = [1,1,1]
      eyesize = 0.03;
      elbowFlare = 0;
      let target = ease((Math.sin(1/3*time)+.6));
      wipe += (target-wipe);
      
      
   }
   if (charging) {
      rate=10;
      headcolor[1]-=0.005;
      headcolor[2]-=0.005;
      eyesize+=0.0001;
      elbowFlare+=.1;
   } 
   


   let P = [Math.sin(time)*.05,1.2-.01*Math.cos(2*rate*time)+Math.min(0,-bend)+jump,.15];
   for (let i = 0 ; i < 2 ; i++) {
      let theta = rate * time + i * Math.PI;
      let c = Math.cos(theta);
      let s = Math.sin(bend) * .5 + .5;
      let sign = i == 0 ? -1 : 1;
      let hip, ankle;

      

      M.push().move(0,Math.min(0,-bend)+jump,0.000001);
         midHip = M.get();
         M.push().move(sign*.15,0,0);
            hip = M.get();
            M.push().move(
                  0,
                  Math.max(bend-legLen, -legLen),
                  0.000001);
               ankle = M.get();
            M.pop();
         M.pop();
      M.pop();

      Hip[i] = pos(hip);
      Hip[2]= pos(midHip);
      Ankle[i] = pos(ankle);
      Knee[i] = ik(Hip[i],.65,.65,Ankle[i],[0,0,1]);
  
      draw(ball, mxm(move(Hip[i]), scale(.05)));
      draw(ball, mxm(move(Knee[i]), scale(.05)));
      draw(ball, mxm(move(Ankle[i]), scale(.05)));

      drawRod(Hip[i], Knee[i], .05);
      drawRod(Knee[i], Ankle[i], .05);

      let shoulder, wrist;

      M.push();
         let S = [sign*.24,.8-.01*Math.cos(2*rate*time)+Math.min(0,-bend)+jump,0];
         M.push().move(S);
            shoulder = M.get();
            M.push().move(0,-.85,.5*.35);
               wrist = M.get();
            M.pop();
         M.pop();
      M.pop();

      Shoulder[i] = pos(shoulder);
      Wrist[i] = pos(wrist);


      if (i ==0) {
         Wrist[i] = mix(Wrist[i], P, wipe);
         Wrist[i] = add(Wrist[i],
	                resize([-0.5,1,1], .5*wipe*(1-wipe)));
         Elbow[i] = ik(Shoulder[i],.45,.45,Wrist[i], [-6*wipe+sign*elbowFlare,-2,-2*-wipe]); 
      }else {
         Elbow[i] = ik(Shoulder[i],.45,.45,Wrist[i], [sign*elbowFlare,-1,-1]);
      }


      

      draw(ball, mxm(move(Shoulder[i]), scale(.05)));
      draw(ball, mxm(move(Elbow[i]), scale(.05)));
      draw(ball, mxm(move(Wrist[i]), scale(.051)));

      drawRod(Shoulder[i], Elbow[i], .05);
      drawRod(Elbow[i], Wrist[i], .05);
   }

   let Head = [0,1.1-.01*Math.cos(2*rate*time)+Math.min(0,-bend)+jump,0];
   let HeadFwd = mix([0,0,1],subtract(P,Head),.01);
   M.push().move(Head).aim(HeadFwd);
      draw(ball, mxm(M.get(), scale(.14,.16,.14)), headcolor);
      draw(ball, mxm(M.get(),
                 mxm(move(-.05,0,.16),scale(eyesize))), [0,0,0]);
      draw(ball, mxm(M.get(),
                 mxm(move( .05,0,.16),scale(.03))), [0,0,0]);
   M.pop();

   drawRod(Hip[0], Hip[1], .05);
   drawRod(Shoulder[0],Shoulder[1], .05);
   
   drawRod(Head, Hip[2], .04);

}

}

gl_start(canvas, new Scene());
</script>

</center>
</body>
